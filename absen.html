<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Ditutup — KPU Kabupaten Buton Selatan</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,540;9..144,620&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f0ee;
    --ink:#1b2436;
    --ink-soft:#6b7590;
    --line:#e7dfda;
    --paper-2:#ffffff;
  }
  [data-theme="dark"]{
    --paper:#141225; --ink:#eef2fa; --ink-soft:#aab4c8; --line:#2c2a48; --paper-2:#1c1a33;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family:'Public Sans', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .serif{ font-family:'Fraunces', serif; }

  .box{
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .icon{
    width:64px; height:64px; margin: 0 auto 22px;
    border-radius: 50%;
    background: var(--paper-2);
    border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-soft);
  }
  h1{
    font-size: 22px; font-weight: 620; margin: 0 0 10px; color: var(--ink);
  }
  p{
    font-size: 14px; line-height:1.6; color: var(--ink-soft); margin:0;
  }
</style>
</head>
<body>

<div class="box">
  <div class="icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="10" width="18" height="11" rx="2"/>
      <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
    </svg>
  </div>
  <h1 class="serif">Halaman ini telah ditutup</h1>
  <p>Terima kasih atas partisipasi Anda. Halaman ini sudah tidak menerima akses lebih lanjut.</p>
</div>

</body>
</html>

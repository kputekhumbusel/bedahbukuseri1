<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi Kegiatan — KPU Kabupaten Buton Selatan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red-600:#d92626;
    --red-700:#b31e1e;
    --red-100:#fbe6e2;
    --amber:#c99a3d;
    --bg:#f7f4ec;
    --panel:#ffffff;
    --ink:#2b241d;
    --ink-soft:#8a7f6d;
    --line:#ece4d4;
  }
  [data-theme="dark"]{
    --bg:#1a1410; --panel:#241c16; --ink:#f2ece1; --ink-soft:#b3a390; --line:#382c22; --red-100:#3a1a14;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1a1410; --panel:#241c16; --ink:#f2ece1; --ink-soft:#b3a390; --line:#382c22; --red-100:#3a1a14;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family:'Poppins', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ text-decoration:none; }

  header{
    background: var(--red-600);
    color:#fff;
    padding: 20px 28px;
  }
  .header-inner{
    max-width: 560px; margin:0 auto;
    display:flex; align-items:center; gap:14px;
  }
  .mark{
    width:42px; height:42px; border-radius:12px; flex-shrink:0;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    padding:6px;
  }
  .mark img{ width:100%; height:100%; object-fit:contain; }
  .header-inner h1{ font-size:17px; font-weight:600; margin:0; color:#fff; }
  .header-inner .org{ font-size:12px; color:#ffdcdc; margin:2px 0 0; }

  .wrap{ max-width:560px; margin:0 auto; padding: 28px 20px 60px; }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 24px 28px;
  }
  .panel .kicker{
    display:inline-block;
    background: var(--red-100); color: var(--red-700);
    font-size:11.5px; font-weight:600; letter-spacing:.03em;
    padding: 5px 12px; border-radius: 999px; margin-bottom: 12px;
  }
  .panel h2{ font-size:19px; font-weight:600; margin:0 0 6px; }
  .panel .desc{ font-size:13px; color: var(--ink-soft); margin:0 0 24px; line-height:1.5; }

  .dl-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background: var(--red-600); color:#fff;
    border-radius: 12px; padding: 15px; width:100%;
    font-weight:600; font-size:15px;
    transition: background .15s ease;
  }
  .dl-btn:hover{ background: var(--red-700); }
  .dl-btn + .dl-btn{ margin-top:12px; background: var(--amber); }
  .dl-btn + .dl-btn:hover{ filter: brightness(0.93); }

  footer{
    max-width:560px; margin:24px auto 0; padding: 0 20px;
    font-size:12px; color: var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="mark"><img src="https://www.kpu.go.id/images/1627539868logo-kpu.png" alt="Logo KPU"></div>
    <div>
      <h1>Materi Kegiatan</h1>
      <p class="org">KPU Kabupaten Buton Selatan</p>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="panel">
    <span class="kicker">Aset kegiatan</span>
    <h2>Unduh Materi Kegiatan</h2>
    <p class="desc">Materi kegiatan dalam format PDF, dapat diunduh dan dipelajari sebelum atau setelah acara berlangsung.</p>

    <!-- Ganti href di bawah ini dengan link Google Drive Anda -->
    <a class="dl-btn" href="https://drive.google.com/drive/folders/1Jea5_0aQgJaWqs3-CBw7oLp8JJ__VStA?usp=drive_link" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3v13M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>
      Unduh Materi Kegiatan
    </a>
  </div>

  <footer>Komisi Pemilihan Umum Kabupaten Buton Selatan</footer>
</div>

</body>
</html>

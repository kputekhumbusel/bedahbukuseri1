<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedah Buku Seri 1 - KPU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        kpuBlue: '#1e3a8a',   /* Dark Blue / Slate-900 vibe */
                        kpuOrange: '#ea580c', /* Prominent Orange */
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom subtle animations */
        .fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gray-50 text-slate-800 font-sans antialiased relative overflow-hidden">
    
    <!-- Decorative Background Elements for modern look -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50 z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-orange-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50 z-0"></div>

    <!-- Main Flexbox Wrapper: Perfectly centered 100vh -->
    <div class="relative z-10 flex flex-col items-center justify-center min-h-screen px-4 py-12 sm:px-6 lg:px-8">
        
        <main class="w-full max-w-4xl mx-auto flex flex-col items-center text-center">
            
            <!-- 1. Overline / Badge text -->
            <div class="fade-in-up mb-6">
                <span class="inline-block px-5 py-1.5 bg-kpuBlue text-white text-sm font-bold tracking-widest rounded-full uppercase shadow-sm">
                    BEDAH BUKU SERI 1
                </span>
            </div>

            <!-- 2. Main Title -->
            <h1 class="fade-in-up delay-100 text-4xl sm:text-5xl md:text-6xl font-extrabold text-slate-900 tracking-tight leading-tight mb-4">
                TATA KELOLA PEMILU DI INDONESIA
            </h1>

            <!-- 3. Subtitle -->
            <h2 class="fade-in-up delay-200 text-xl sm:text-2xl md:text-3xl font-semibold text-slate-600 mb-12">
                PEMUNGUTAN DAN PENGHITUNGAN
            </h2>

            <!-- 4. Coming Soon Block -->
            <div class="fade-in-up delay-300 relative inline-block">
                <!-- Orange decorative line behind -->
                <div class="absolute inset-0 bg-kpuOrange transform scale-x-105 scale-y-110 rounded rotate-1 opacity-20"></div>
                <!-- Box Content -->
                <div class="relative bg-white border-2 border-kpuOrange text-kpuOrange px-8 py-4 rounded-lg shadow-lg">
                    <span class="text-3xl md:text-4xl font-black tracking-[0.2em] uppercase">
                        COMING SOON
                    </span>
                </div>
            </div>

        </main>

    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situs Sedang Dalam Perbaikan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .maintenance-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .icon {
            font-size: 60px;
            color: #ff6b6b;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        p {
            font-size: 15px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-text {
            font-size: 13px;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <!-- Anda bisa mengganti emoji ini dengan tag <img> jika punya logo -->
        <div class="icon">⚙️</div>
        
        <h1>Kami Segera Kembali!</h1>
        
        <p>Mohon maaf atas ketidaknyamanannya. Saat ini situs kami sedang dalam pemeliharaan rutin untuk meningkatkan pengalaman Anda. Silakan kunjungi kembali beberapa saat lagi.</p>
        
        <div class="loader"></div>

        <div class="footer-text">
            &copy; 2026 KPU Busel. All rights reserved.
        </div>
    </div>

</body>
</html>
